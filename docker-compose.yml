services:
  nestjs:
    image: ${MINEPANEL_IMAGE:-ghcr.io/minepanelproject/minepanel-backend:latest}
    pull_policy: missing
    expose:
      - "3000"
    user: root
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:?}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      DOMAIN: ${DOMAIN:?}
      # container-side path (the host socket is mounted at this fixed location)
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_NETWORK: ${DOCKER_NETWORK:-minepanel_network}
      MC_DATA_PATH: /mc-data
      MC_DATA_BIND_SOURCE: ${MC_DATA_PATH_HOST:?}
      MC_PORT_MIN: ${MC_PORT_MIN:-25565}
      MC_PORT_MAX: ${MC_PORT_MAX:-25665}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
      MAX_MEMORY_RATIO: ${MAX_MEMORY_RATIO:-0.90}
      STOP_WARN_SECONDS: ${STOP_WARN_SECONDS:-30}
      MINECRAFT_IMAGE: ${MINECRAFT_IMAGE:?Set MINECRAFT_IMAGE to a versioned image identity}
      MC_CPU_NANO_CPUS: ${MC_CPU_NANO_CPUS:-2000000000}
      MC_PIDS_LIMIT: ${MC_PIDS_LIMIT:-512}
      REQUIRE_ADMIN_APPROVAL: ${REQUIRE_ADMIN_APPROVAL:-true}
      PANEL_NAME: ${PANEL_NAME:-MinePanel}
      PANEL_DESCRIPTION: ${PANEL_DESCRIPTION:-Minecraft server management panel API}
      PANEL_VERSION: ${PANEL_VERSION:-1.0}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${MC_DATA_PATH_HOST:?}:/mc-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      minecraft-image:
        condition: service_completed_successfully
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minepanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: minepanel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minepanel"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    depends_on:
      nestjs:
        condition: service_started

  minecraft-image:
    image: ${MINECRAFT_IMAGE:?Set MINECRAFT_IMAGE to a versioned image identity}
    entrypoint: ["/bin/true"]
    restart: "no"
    networks:
      - mc

networks:
  app:
    driver: bridge
    name: ${MINEPANEL_APP_NETWORK:-minepanel-app-network}
  mc:
    driver: bridge
    name: ${DOCKER_NETWORK:-minepanel_network}

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-minepanel-postgres-data}
  caddy-data:
    name: ${CADDY_DATA_VOLUME_NAME:-minepanel-caddy-data}
  caddy-config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-minepanel-caddy-config}
